"374.0" stroke="#9AA0A6" stroke-width="2"/><text x="540.0" y="338.9" text-anchor="middle" xml:space="preserve" font-family="Helvetica, Arial, sans-serif"><tspan fill="#202124" font-size="13.0" font-weight="bold">Fixtures + overlay</tspan></text><text x="540.0" y="354.9" text-anchor="middle" xml:space="preserve" font-family="Helvetica, Arial, sans-serif"><tspan fill="#5f6368" font-size="11.0" font-weight="normal">rekaman 11 Sep + accepted</tspan></text><rect x="800.0" y="310.0" width="200.0" height="64.0" fill="#FFFFFF" stroke="none"/><line x1="800.0" y1="310.0" x2="1000.0" y2="310.0" stroke="#9AA0A6" stroke-width="2"/><line x1="800.0" y1="374.0" x2="1000.0" y2="374.0" stroke="#9AA0A6" stroke-width="2"/><text x="900.0" y="338.9" text-anchor="middle" xml:space="preserve" font-family="Helvetica, Arial, sans-serif"><tspan fill="#202124" font-size="13.0" font-weight="bold">Memori GCS</tspan></text><text x="900.0" y="354.9" text-anchor="middle" xml:space="preserve" font-family="Helvetica, Arial, sans-serif"><tspan fill="#5f6368" font-size="11.0" font-weight="normal">playbook + insight + resolusi</tspan></text><rect x="80.0" y="468.0" width="1314.0" height="176.0" rx="0" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1"/><text x="90.0" y="487.0" font-size="13.0" fill="#202124" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Threats · STRIDE</text><text x="94.0" y="516.6" text-anchor="start" xml:space="preserve" font-family="Helvetica, Arial, sans-serif"><tspan fill="#3C4043" font-size="12.0" font-weight="normal">1. </tspan><tspan fill="#3C4043" font-size="12.0" font-weight="bold">Spoofing</tspan><tspan fill="#3C4043" font-size="12.0" font-weight="normal"> · watchlist misal ANTM — Misal di warnet ada yang ngaku jadi kamu liat ANTM-mu </tspan><tspan fill="#188038" font-size="12.0" font-weight="normal">→ Pakai browser sendiri, cookie uid milikmu; habis warnet keluar + hapus</tspan></text><text x="94.0" y="538.6" text-anchor="start" xml:space="preserve" font-family="Helvetica, Arial, sans-serif"><tspan fill="#3C4043" font-size="12.0" font-weight="normal">2. </tspan><tspan fill="#3C4043" font-size="12.0" font-weight="bold">Information disclosure</tspan><tspan fill="#3C4043" font-size="12.0" font-weight="normal"> · watchlist misal ANTM — Misal screenshare, watchlist ANTM-mu keliatan orang </tspan><tspan fill="#188038" font-size="12.0" font-weight="normal">→ Tutup dulu pas share, jangan pasang nama di gambar</tspan></text><text x="94.0" y="560.6" text-anchor="start" xml:space="preserve" font-family="Helvetica, Arial, sans-serif"><tspan fill="#3C4043" font-size="12.0" font-weight="normal">3. </tspan><tspan fill="#3C4043" font-size="12.0" font-weight="bold">Tampering</tspan><tspan fill="#3C4043" font-size="12.0" font-weight="normal"> · minta fixtures + overlay — Misal rekaman 11 Sep dikira live hari ini </tspan><tspan fill="#188038" font-size="12.0" font-weight="normal">→ Tiap layar tulis asOf + staleness; overlay cuma dari accepted</tspan></text><text x="94.0" y="582.6" text-anchor="start" xml:space="preserve" font-family="Helvetica, Arial, sans-serif"><tspan fill="#3C4043" font-size="12.0" font-weight="normal">4. </tspan><tspan fill="#3C4043" font-size="12.0" font-weight="bold">Information disclosure</tspan><tspan fill="#3C4043" font-size="12.0" font-weight="normal"> · baca playbook + insight — Misal insight ANTM dibaca temen satu browser </tspan><tspan fill="#188038" font-size="12.0" font-weight="normal">→ Insight cuma di persist browsermu + uid GCS-mu</tspan></text><text x="94.0" y="604.6" text-anchor="start" xml:space="preserve" font-family="Helvetica, Arial, sans-serif"><tspan fill="#3C4043" font-size="12.0" font-weight="normal">5. </tspan><tspan fill="#3C4043" font-size="12.0" font-weight="bold">Denial of service</tspan><tspan fill="#3C4043" font-size="12.0" font-weight="normal"> · baca memori buat jawab — Misal copilot malah bilang beli aja! </tspan><tspan fill="#188038" font-size="12.0" font-weight="normal">→ safeLanguage tolak saran transaksi, wajib sitasi + intent</tspan></text><text x="94.0" y="626.6" text-anchor="start" xml:space="preserve" font-family="Helvetica, Arial, sans-serif"><tspan fill="#3C4043" font-size="12.0" font-weight="normal">6. </tspan><tspan fill="#3C4043" font-size="12.0" font-weight="bold">Elevation of privilege</tspan><tspan fill="#3C4043" font-size="12.0" font-weight="normal"> · teruskan tanya — Misal kandidat web-watch langsung jadi fakta </tspan><tspan fill="#188038" font-size="12.0" font-weight="normal">→ Kandidat impactLinks kosong; manusia accept + tulis path dulu</tspan></text><path d="M 280.0 132.0 L 440.0 132.0" fill="none" stroke="#EA4335" stroke-width="2" stroke-linejoin="round" marker-end="url(#aEA4335)"/><path d="M 640.0 132.0 L 800.0 132.0" fill="none" stroke="#4285F4" stroke-width="2" stroke-linejoin="round" marker-end="url(#a4285F4)"/><path d="M 860.0 164.0 L 860.0 237.0 L 540.0 237.0 L 540.0 310.0" fill="none" stroke="#4285F4" stroke-width="2" stroke-linejoin="round" marker-end="url(#a4285F4)"/><path d="M 920.0 164.0 L 920.0 237.0 L 880.0 237.0 L 880.0 310.0" fill="none" stroke="#4285F4" stroke-width="2" stroke-linejoin="round" marker-end="url(#a4285F4)"/><path d="M 1260.0 164.0 L 1260.0 210.0 L 920.0 210.0 L 920.0 310.0" fill="none" stroke="#4285F4" stroke-width="2" stroke-linejoin="round" marker-end="url(#a4285F4)"/><path d="M 1000.0 132.0 L 1160.0 132.0" fill="none" stroke="#4285F4" stroke-width="2" stroke-linejoin="round" marker-end="url(#a4285F4)"/><circle cx="360.0" cy="132.0" r="11.0" fill="#EA4335" stroke="#FFFFFF" stroke-width="2"/><text x="360.0" y="135.6" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, sans-serif">1,2</text><circle cx="700.0" cy="237.0" r="11.0" fill="#EA4335" stroke="#FFFFFF" stroke-width="2"/><text x="700.0" y="240.6" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, sans-serif">3</text><c