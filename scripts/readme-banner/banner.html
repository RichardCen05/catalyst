<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;800;900&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body {
    font-family: Geist, system-ui, sans-serif; color: #141214;
    background:
      radial-gradient(ellipse 900px 520px at 50% 108%, rgba(160, 32, 72, .10), transparent 70%),
      radial-gradient(circle at 1px 1px, rgba(20,18,20,.07) 1px, transparent 0) 0 0 / 22px 22px,
      #f6f4f0;
    position: relative;
  }
  .brand { position: absolute; top: 58px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 18px; }
  .mark { width: 76px; height: 76px; border-radius: 18px; background: #000 url(../../public/catalyst-mark.png) center / 118% no-repeat; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .word { font-size: 64px; font-weight: 600; letter-spacing: -2.5px; }
  h1 { position: absolute; top: 170px; left: 0; right: 0; text-align: center; font-size: 70px; font-weight: 900; letter-spacing: -2.5px; white-space: nowrap; line-height: 1; text-transform: uppercase; }
  h1 em { font-style: normal; color: #a01f4a; }
  .sub { position: absolute; top: 268px; left: 0; right: 0; text-align: center; font-size: 30px; line-height: 1.42; color: #3a353b; font-weight: 400; }
  .sub b { font-weight: 600; color: #141214; }
  .shot { position: absolute; border-radius: 14px; overflow: hidden; background: #fff; border: 1px solid rgba(0,0,0,.10); box-shadow: 0 30px 60px -18px rgba(30,20,30,.35), 0 8px 18px rgba(30,20,30,.10); }
  .shot img { display: block; width: 100%; }
  .back { left: 120px; top: 440px; width: 660px; transform: rotate(-3deg); opacity: .96; }
  .back2 { right: 120px; top: 450px; width: 660px; transform: rotate(3deg); opacity: .96; }
  .front { left: 50%; top: 405px; width: 760px; transform: translateX(-50%); }
  .chip { position: absolute; width: 74px; height: 74px; border-radius: 18px; display: grid; place-items: center; background: #fff; border: 1px solid rgba(0,0,0,.08); box-shadow: 0 14px 30px -10px rgba(30,20,30,.35); }
  .chip svg { width: 36px; height: 36px; stroke: #141214; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .chip.accent { background: #a01f4a; border-color: #a01f4a; }
  .chip.accent svg { stroke: #fff; }
  .tag { position: absolute; font-family: "Geist Mono", monospace; font-size: 15px; font-weight: 500; padding: 8px 14px; border-radius: 999px; background: #141214; color: #f6f4f0; box-shadow: 0 10px 24px -8px rgba(0,0,0,.45); letter-spacing: .2px; }
  .tag i { font-style: normal; color: #58c99a; }
</style></head>
<body>
  <div class="brand"><div class="mark"></div><div class="word">Catalyst</div></div>
  <h1>Trace the move. <em>Trust the evidence.</em></h1>
  <p class="sub">An evidence-first watchlist investigator for Indonesian stocks.<br><b>See what changed. Test why. Know what would prove it wrong.</b></p>

  <div class="shot back"><img src="../../public/brand/screens/dash.png"></div>
  <div class="shot back2"><img src="../../public/brand/screens/impact.png"></div>
  <div class="shot front"><img src="../../public/brand/screens/case-antm.png"></div>

  <div class="chip accent" style="left:80px; top:500px"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-7"/><path d="M16 7h4v4"/></svg></div>
  <div class="chip" style="left:120px; top:770px"><svg viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10"/><path d="M18 10c0 4-6 3-11 7"/></svg></div>
  <div class="chip" style="right:78px; top:505px"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/><path d="M12 12 19 5"/></svg></div>
  <div class="chip accent" style="right:110px; top:765px"><svg viewBox="0 0 24 24"><path d="M9 3a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 3 3h1V3z"/><path d="M15 3a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-3 3h-1V3z"/></svg></div>

  <div class="tag" style="left:250px; top:410px">SECTORS API · <i>recorded</i></div>
  <div class="tag" style="right:240px; top:418px">every figure cited</div>
</body></html>
